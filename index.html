<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포켓 재고">
<meta name="theme-color" content="#bfdbfe">
<title>포켓몬 카드 재고 현황</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1b1e23; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; --ok:#15803d; --warn:#b45309; --chip:#eef2ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121418; --card:#1b1e24; --ink:#eef0f3; --muted:#9aa3b2; --line:#2a2f38; --accent:#7aa2ff; --ok:#4ade80; --warn:#fbbf24; --chip:#222a44; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .stale { color: var(--warn); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 6px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 2px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .total { font-size: 14px; color: var(--ok); font-weight: 600; white-space: nowrap; }
  .place { margin: 12px 0 4px; font-size: 13px; font-weight: 700; color: var(--accent); }
  ul { list-style: none; margin: 0 0 8px; padding: 0; }
  li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .chain { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .store { overflow-wrap: anywhere; }
  .store small { color: var(--muted); }
  .qty { font-weight: 700; font-variant-numeric: tabular-nums; }
  .qty small { font-weight: 400; color: var(--muted); }
  li.sold { opacity: .6; }
  .soldhead { color: var(--warn); margin-top: 14px; }
  li.sold .qty { color: var(--warn); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 18px; }
  .push { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 18px 0 0; font-size: 14.5px; }
  .push button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 9px 14px; margin: 8px 8px 0 0; }
  .push textarea { width: 100%; height: 84px; margin-top: 10px; font: 12px/1.4 ui-monospace,Menlo,monospace; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 8px; }
  .push .ok { color: var(--ok); font-weight: 600; } .push .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>포켓몬 카드 재고 현황</h1>
  <div class="meta" id="meta">불러오는 중…</div>
  <div id="list"></div>
  <p class="note">편의점 앱의 시스템 재고입니다. 실제 진열과 다를 수 있고, 입고 처리가 물건 도착보다 먼저 올라갈 수 있어요. GS25는 앱에 실제의 약 70%만 보이는 것으로 추정해 옆에 환산값을 적었어요. 품절 표시는 12시간 동안 남겨 둡니다. 가시기 전에 점포에 확인해 주세요.</p>
  <section class="push" id="push" hidden></section>
</main>
<script>
(function () {
  var STALE_MIN = 40;   // 이보다 오래 갱신이 없으면 경고(올리는 쪽은 1분마다 확인하고, 바뀌면 바로·안 바뀌어도 5분마다 올린다)
  var meta = document.getElementById('meta');
  var list = document.getElementById('list');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function ago(min) {
    if (min < 1) return '방금';
    if (min < 60) return Math.floor(min) + '분 전';
    return Math.floor(min / 60) + '시간 ' + Math.floor(min % 60) + '분 전';
  }

  function render(d) {
    var t = new Date(d.generated_at);
    var min = (Date.now() - t.getTime()) / 60000;
    meta.textContent = '';
    meta.appendChild(document.createTextNode(ago(min) + ' 기준 · 재고가 바뀌면 1~2분 안에 반영돼요'));
    if (min > STALE_MIN) {
      meta.appendChild(el('div', 'stale', '갱신이 40분 넘게 멈춰 있어요. 아래 숫자가 오래됐을 수 있어요.'));
    }
    if (d.failed && d.failed.length) {
      meta.appendChild(el('div', 'stale', d.failed.join('·') + ' 조회가 잠깐 안 돼서 직전 값을 보여 줘요.'));
    }
    list.textContent = '';
    var rows = d.rows || [];
    if (!rows.length) {
      list.appendChild(el('div', 'empty', '지금 재고가 있는 점포가 없어요.'));
      return;
    }
    (d.order || []).forEach(function (g) {
      var items = rows.filter(function (r) { return r.group === g; });
      if (!items.length) return;
      var live = items.filter(function (r) { return r.qty > 0; });
      var total = live.reduce(function (s, r) { return s + r.qty; }, 0);
      var soldN = items.length - live.length;
      var card = el('section', 'card');
      var h = el('h2');
      h.appendChild(el('span', null, g));
      h.appendChild(el('span', 'total', live.length + '곳 · ' + total + '개' + (soldN ? ' · 품절 ' + soldN + '곳' : '')));
      card.appendChild(h);
      (d.places || []).forEach(function (p) {
        var here = live.filter(function (r) { return r.place === p; });
        if (!here.length) return;
        card.appendChild(el('div', 'place', p + ' 거점'));
        var ul = el('ul');
        here.forEach(function (r) {
          var li = el('li', r.qty > 0 ? '' : 'sold');
          li.appendChild(el('span', 'chain', r.chain));
          var s = el('span', 'store', r.store + ' ');
          s.appendChild(el('small', null, r.dist + 'm'));
          li.appendChild(s);
          var q = el('span', 'qty', r.qty > 0 ? r.qty + '개' : '품절 ' + new Date(r.sold_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }));
          if (r.chain === 'GS25' && r.qty > 0) q.appendChild(el('small', null, ' 실제 약 ' + Math.round(r.qty / 0.7) + '개'));  // GS25 앱은 실제의 약 70%만 보여 준다는 추정
          li.appendChild(q);
          ul.appendChild(li);
        });
        card.appendChild(ul);
      });
      var gone = items.filter(function (r) { return r.qty <= 0; });
      if (gone.length) {
        card.appendChild(el('div', 'place soldhead', '품절 (12시간 동안 표시)'));
        var ul2 = el('ul');
        gone.forEach(function (r) {
          var li = el('li', 'sold');
          li.appendChild(el('span', 'chain', r.chain));
          var s = el('span', 'store', r.store + ' ');
          s.appendChild(el('small', null, r.place + ' · ' + r.dist + 'm'));
          li.appendChild(s);
          li.appendChild(el('span', 'qty', new Date(r.sold_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false })));
          ul2.appendChild(li);
        });
        card.appendChild(ul2);
      }
      list.appendChild(card);
    });
  }

  function load() {
    // 현황은 저장소의 data 가지에 1분 단위로 올라온다. 깃허브 API로 바로 읽고(1분 안쪽으로 새 값), 막히면 raw 주소(최대 5분 늦음)로 읽는다.
    // 페이지 자체(main 가지)를 다시 짓지 않아도 돼서 예전처럼 10분씩 늦지 않는다.
    fetch('https://api.github.com/repos/YTS8989/pk-status-8e6ee7/contents/status.json?ref=data', { headers: { Accept: 'application/vnd.github.raw+json' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function () {
        return fetch('https://raw.githubusercontent.com/YTS8989/pk-status-8e6ee7/data/status.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
      })
      .then(function (d) { if (!d.generated_at) { meta.textContent = '아직 데이터가 없어요.'; return; } render(d); })
      .catch(function () { meta.textContent = '불러오지 못했어요. 잠시 뒤 다시 시도해요.'; });
  }
  load();
  setInterval(load, 60000);
})();
</script>
<script>
// 알림 받기: 홈 화면에 추가한 뒤 켠다. 켜면 이 폰만의 수신 코드가 생기고, 그 코드를 보내 주면 입고·품절 때 알림이 온다.
(function () {
  var VAPID = 'BLq6udcbGNMHSr9D8nFyUYmnf6jdpgbGpAGM7UmTzN47VuufWyJdIvOG9FVGpEKRa1c0AbvTKGdA8lihNcLsj3s';
  var box = document.getElementById('push');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function say(nodes) { box.textContent = ''; nodes.forEach(function (n) { box.appendChild(n); }); box.hidden = false; }
  function key(b64) { var s = atob((b64 + '==='.slice((b64.length + 3) % 4)).replace(/-/g, '+').replace(/_/g, '/')); var a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

  function showCode(sub) {
    var code = JSON.stringify(sub);
    var ta = el('textarea'); ta.readOnly = true; ta.value = code;
    var copy = el('button', null, '코드 복사');
    copy.onclick = function () {
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { copy.textContent = '복사됐어요'; },
        function () { ta.focus(); ta.select(); copy.textContent = '위 글자를 길게 눌러 복사해 주세요'; });
    };
    var nodes = [el('div', 'ok', '알림이 켜졌어요.'), el('div', 'muted', '아래 코드를 복사해서 보내 주세요. 등록되면 "알림 연결 완료" 알림이 와요. (처음 한 번만)'), ta, copy];
    if (navigator.share) { var sh = el('button', null, '코드 보내기'); sh.onclick = function () { navigator.share({ text: code }); }; nodes.push(sh); }
    say(nodes);
  }

  function turnOn() {
    Notification.requestPermission().then(function (p) {
      if (p !== 'granted') { say([el('div', null, '알림이 꺼져 있어요. 설정 > 알림에서 "포켓 재고"를 허용한 뒤 다시 열어 주세요.')]); return; }
      return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; })
        .then(function (reg) { return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key(VAPID) }); })
        .then(showCode);
    }).catch(function (e) { say([el('div', null, '알림을 켜지 못했어요: ' + (e && e.message || e))]); });
  }

  if (ios && !standalone) {  // 아이폰은 홈 화면에 추가한 앱에서만 알림을 준다
    say([el('div', null, '입고·품절 알림을 받으려면: 아래 공유 버튼 → "홈 화면에 추가" → 홈 화면의 "포켓 재고" 아이콘으로 다시 열어 주세요.')]);
    return;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;  // 알림을 못 받는 브라우저에서는 아무것도 보이지 않는다
  navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; })
    .then(function (reg) { return reg.pushManager.getSubscription(); })
    .then(function (sub) {
      if (sub && Notification.permission === 'granted') {
        var again = el('button', null, '코드 다시 보기'); again.onclick = function () { showCode(sub); };
        say([el('div', 'ok', '알림 켜짐'), again]);
      } else {
        var b = el('button', null, '알림 받기'); b.onclick = turnOn;
        say([el('div', null, '입고·품절이 생기면 알림으로 알려 드려요.'), b]);
      }
    }).catch(function () {});
})();
</script>
</body>
</html>
